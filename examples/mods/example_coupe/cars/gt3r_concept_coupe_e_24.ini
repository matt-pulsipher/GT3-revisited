; GT3R Concept Coupe E: the example's electric car, on the same body as the Concept Coupe
; (gt3r_concept_coupe_24.ini, which explains every shared value). This file comments only
; what an electric car does differently: docs/MODDING.md "Electric cars".

[car]
label = gt3r_concept_coupe_e_24 ; unique id: its own, although it shares the body
name = Concept Coupe E
maker = GT3R                   ; sold next to the Concept Coupe at the GT3R dealer
year = 2024
price = 78000                  ; credits: the V6 coupe's 52,000 plus its battery
category = production
donor = z_detroitver_01        ; the Concept Coupe's donor: suspension geometry, steering, tire compounds,
                               ; brakes and aids. An electric car borrows no engine, gearbox or driveline
                               ; parts, and the tune shop sells it none.

[body]
weight_kg = 1850               ; the coupe's 1,420 kg, less the V6 and gearbox, plus a 75 kWh battery
front_weight_pct = 48          ; the battery under the floor, a motor on each axle
length_mm = 4357               ; the body: as the Concept Coupe
width_mm = 2236
height_mm = 1149
wheelbase_mm = 2799
front_track_mm = 1952
rear_track_mm = 1964
cd = 0.29
frontal_area_m2 = 2.06

[powertrain]
type = electric                ; the race drives it with the electric drive: one reduction, no gear changes,
                               ; lift-off regen and a stop-and-hold (docs/MODDING.md "Electric cars")
power_kw = 400                 ; both motors together (544 PS)
torque_nm = 700                ; at the motors: full torque from standstill up to power / torque (5,460 rpm),
                               ; constant power above it
max_rpm = 15800                ; the motors' top speed, and so the car's: 250 km/h on the 768 mm tires through
                               ; the 9.0 reduction (the drive fades out over its last 2 %)
; regen_g = 0.2                ; lift-off deceleration at town speeds (the default)
layout = Dual Motor            ; the specs screen's texts
aspiration = EV
displacement = 75kWh

[drivetrain]
drive = AWD                    ; one motor per axle
front_torque_pct = 40          ; a fixed split; more at the rear for a rear-biased feel
gears = 9.0                    ; the single reduction (motor turns per wheel turn)

[tires]
front = 265/40R22              ; the Concept Coupe's sizes: they fit the modeled arches
rear = 295/35R22
grip_pct = 88

[model]
file = models/concept_coupe.glb ; the same body file as the Concept Coupe
wheel = enw010_b

[paints]                       ; the first is the dealer picture's
Pearl White = #E7E5DF
Glacier Silver = #B8BCC0
Graphite Gray = #3B3E43
Midnight Blue = #1D2A4B
Carmine Red = #9B1B24
Solar Yellow = #E2B01C

[dealer]
for_sale = yes
description = The Concept Coupe E is the electric version of GT3 Revisited's example car: the same 2+2 body with a motor on each axle, 400 kW and 700 Nm from standstill, one reduction gear instead of six and a battery under the floor. Lift off and the motors slow the car; they hold it at a stop.
picture = images/concept_coupe_e.png       ; rendered like the Concept Coupe's (README.md "Pictures")
thumb = images/concept_coupe_e_thumb.png

[arcade]
class = auto
level = 0

[reference]
; Targets for its class (~540 PS, 1,850 kg, two motors, summer tires), with a 1 ft
; rollout like the Concept Coupe's. Only `gt3tool modcar` reads these.
zero_to_60_s = 3.3
quarter_mile_s = 11.6
top_speed_kmh = 250
