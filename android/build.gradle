buildscript {
    repositories {
        google()
        // Google's mirror of Maven Central first: Central answers busy CI addresses with
        // HTTP 429 (Too Many Requests). Central itself stays as the fallback.
        maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
    }
}

allprojects {
    repositories {
        google()
        // Maven Central mirror first, as above.
        maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
        mavenCentral()
    }
}
