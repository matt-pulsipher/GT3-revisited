# Parsed by the infrastructure agent's Fluent Bit (gt3r-relay-players.conf).
# Each JSON line relay-health.py writes becomes one log record; the keys are the
# New Relic Logs attributes. No Time_Key: the agent's timestamp is when the line
# was forwarded (within a minute). logTime inside the JSON is the relay's UTC time.
[PARSER]
    Name   gt3r_player_json
    Format json
