# Tails the player JSON written by relay-health.py. The infrastructure agent
# adds the output that ships records to New Relic. Do not add an output section
# in this file: a second one double-sends.
#
# The relay's own journal is the gt3r-relay namespace (LogNamespace=). The agent's
# logging.d "systemd:" source only reads the default journal, which is why this
# file tails a JSON file the health script fills from
# `journalctl --namespace=gt3r-relay` instead.
#
# relay-health.py is what drops raw IPs. This parser only promotes the JSON keys
# (message, event, session, playerTag, country, logTime, logtype, service).

[INPUT]
    Name              tail
    Tag               gt3r.player
    Path              /var/log/gt3r-relay/players.log
    Path_Key          filePath
    DB                /var/lib/gt3r-monitoring/player-tail.db
    DB.Sync           Normal
    Read_from_Head    True
    Refresh_Interval  10
    Rotate_Wait       5
    Skip_Long_Lines   On
    Mem_Buf_Limit     5MB
    Parser            gt3r_player_json
